version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbeittech_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-arbeittech_db}
      DB_USERNAME: ${DB_USERNAME:-arbeittech_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - arbeittech_network

  web:
    image: nginx:alpine
    container_name: arbeittech_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - arbeittech_network

  db:
    image: mysql:8.0
    container_name: arbeittech_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-arbeittech_db}
      MYSQL_USER: ${DB_USERNAME:-arbeittech_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - arbeittech_network

networks:
  arbeittech_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
